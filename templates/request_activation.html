{% extends "base.html" %}
{% block title %}طلب تفعيل الجهاز{% endblock %}
{% block page_title %}🔑 طلب تفعيل جديد{% endblock %}

{% block content %}
<div class="card">
    <h3><i class="fas fa-microchip"></i> معرف الجهاز الفريد</h3>
    <p>قم بنسخ الرقم أدناه وإرساله إلى مدير النظام لإنشاء رمز تفعيل لك.</p>
    <div style="background: #f7fafc; padding: 15px; border-radius: 12px; margin: 20px 0; text-align: center; direction: ltr;">
        <code id="hardware-id" style="font-size: 18px; word-break: break-all;">{{ hardware_id }}</code>
    </div>
    <button onclick="copyToClipboard()" class="action-btn action-btn-excel" style="background:#4299e1;"><i class="fas fa-copy"></i> نسخ الرقم</button>
</div>

<script>
    function copyToClipboard() {
        const copyText = document.getElementById('hardware-id').innerText;
        navigator.clipboard.writeText(copyText).then(() => {
            alert('✅ تم نسخ معرف الجهاز!');
        });
    }
</script>
{% endblock %}
