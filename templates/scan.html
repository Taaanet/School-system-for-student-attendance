<!DOCTYPE html>
<html dir="rtl">
<head>
<meta charset="UTF-8">

<script src="https://unpkg.com/html5-qrcode"></script>

</head>
<body>

<h2>مسح بطاقة الطالب</h2>

<div id="reader"></div>

<script>
function onScanSuccess(decodedText) {
    alert("تمت قراءة الكود: " + decodedText);
}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: 250
    },
    onScanSuccess
).catch(err => {
    console.log(err);
});
</script>

</body>
</html>
