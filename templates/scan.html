<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>مسح حضور الطلاب</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 10px;
            overflow: hidden;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #stopBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            font-size: 16px;
            line-height: 1.6;
            text-align: right;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .student-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: right;
        }
        .student-card p {
            margin: 8px 0;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
</head>
<body>
<div class="container">
    <h2>📱 نظام رصد الحضور والتأخير</h2>
    
    <button id="startBtn">▶️ بدء المسح</button>
    <button id="stopBtn">⏹️ إيقاف المسح</button>
    
    <div id="reader"></div>
    <div id="result"></div>
</div>

<script>
let html5QrCode = null;
let isScanning = false;

// زر بدء المسح
document.getElementById("startBtn").addEventListener("click", function() {
    if (isScanning) return;
    
    showResult("⏳ جاري تشغيل الكاميرا...", "info");
    startScanner();
});

// زر إيقاف المسح
document.getElementById("stopBtn").addEventListener("click", function() {
    stopScanner();
});

// دالة عرض النتيجة
function showResult(message, type, studentData = null) {
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.className = type;
    
    if (studentData) {
        // عرض بطاقة الطالب كاملة
        resultDiv.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 10px;">${message}</div>
            <div class="student-card">
                <p>📋 <strong>معلومات الطالب:</strong></p>
                <p>🧑‍🎓 <strong>الاسم:</strong> ${studentData.student_name}</p>
                <p>📚 <strong>الصف:</strong> ${studentData.student_grade}</p>
                <p>🏫 <strong>الشعبة:</strong> ${studentData.student_class}</p>
                <p>⏰ <strong>الوقت:</strong> ${studentData.time}</p>
                <p>📅 <strong>التاريخ:</strong> ${studentData.date}</p>
                <p>🆔 <strong>رقم الطالب:</strong> ${studentData.student_id}</p>
            </div>
        `;
    } else {
        resultDiv.innerHTML = message;
    }
}

// دالة معالجة نجاح المسح
function onScanSuccess(decodedText, decodedResult) {
    console.log("✅ تم مسح الكود:", decodedText);
    
    // إيقاف المسح مؤقتاً
    stopScanner();
    
    // عرض رسالة جاري المعالجة
    showResult("🔄 جاري معالجة بيانات الطالب...<div class='loading'></div>", "info");
    
    // إرسال البيانات إلى الخادم
    fetch('/process_scan', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ qr_data: decodedText })
    })
    .then(response => {
        console.log("📡 استجابة من الخادم:", response.status);
        if (!response.ok) {
            throw new Error(`خطأ في الخادم: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        console.log("📦 بيانات الاستجابة:", data);
        
        if (data.status === "error") {
            showResult(`❌ ${data.message}`, "error");
        } else {
            // عرض النجاح مع بيانات الطالب
            showResult(data.message, "success", data);
        }
        
        // عرض زر لإعادة المسح
        setTimeout(() => {
            if (confirm("✅ هل تريد مسح طالب آخر؟")) {
                startScanner();
            }
        }, 2000);
    })
    .catch(error => {
        console.error("❌ خطأ:", error);
        showResult(`❌ حدث خطأ: ${error.message}<br>تأكد من اتصال الإنترنت وحاول مرة أخرى`, "error");
        
        // إعادة تشغيل المسح بعد 3 ثوانٍ
        setTimeout(() => {
            startScanner();
        }, 3000);
    });
}

// دالة بدء المسح
function startScanner() {
    const readerElement = document.getElementById("reader");
    readerElement.innerHTML = ""; // تنظيف العنصر
    
    html5QrCode = new Html5Qrcode("reader");
    
    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0
    };
    
    html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess
    ).then(() => {
        isScanning = true;
        document.getElementById("startBtn").style.display = "none";
        document.getElementById("stopBtn").style.display = "inline-block";
        showResult("📷 الكاميرا تعمل... امسح رمز QR الخاص بالطالب", "info");
    }).catch(err => {
        console.error("خطأ في تشغيل الكاميرا:", err);
        showResult(`❌ لا يمكن تشغيل الكاميرا: ${err}<br><br>
        💡 الحلول:<br>
        1. تأكد من منح الإذن لاستخدام الكاميرا<br>
        2. استخدم اتصال HTTPS<br>
        3. جرب متصفح Chrome أو Safari`, "error");
        document.getElementById("startBtn").style.display = "inline-block";
    });
}

// دالة إيقاف المسح
function stopScanner() {
    if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
            isScanning = false;
            document.getElementById("startBtn").style.display = "inline-block";
            document.getElementById("stopBtn").style.display = "none";
        }).catch(err => {
            console.error("خطأ في إيقاف المسح:", err);
        });
    }
}

// تنظيف عند مغادرة الصفحة
window.addEventListener('beforeunload', function() {
    if (html5QrCode && isScanning) {
        html5QrCode.stop();
    }
});
</script>

</body>
</html>
