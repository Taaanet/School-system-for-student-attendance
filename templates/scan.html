<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسح QR - اختبار</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
        }
        #reader {
            width: 100%;
            margin: 20px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .manual-input {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/dist/html5-qrcode.min.js"></script>
</head>
<body>
<div class="container">
    <h2>📱 مسح QR Code</h2>
    
    <button id="startBtn">▶️ بدء الكاميرا</button>
    <div id="reader"></div>
    <div id="result"></div>
    
    <div class="manual-input">
        <h3>🖱️ أو أدخل الرقم يدوياً</h3>
        <input type="text" id="manualId" placeholder="أدخل رقم الطالب">
        <button onclick="testManual()">اختبار</button>
    </div>
    
    <div style="margin-top: 20px;">
        <p><strong>📋 الأرقام المتاحة للاختبار:</strong></p>
        <p id="availableIds">جاري التحميل...</p>
    </div>
</div>

<script>
let html5QrCode = null;
let isScanning = false;

// تحميل الأرقام المتاحة
async function loadAvailableIds() {
    try {
        const response = await fetch('/api/students_list');
        const data = await response.json();
        if (data.success && data.data) {
            const ids = data.data.map(s => s.student_id).join(', ');
            document.getElementById('availableIds').innerHTML = ids || 'لا توجد بيانات';
        }
    } catch(e) {
        document.getElementById('availableIds').innerHTML = 'خطأ في التحميل';
    }
}
loadAvailableIds();

document.getElementById("startBtn").addEventListener("click", function() {
    if (isScanning) return;
    startScanner();
});

function showResult(message, type, studentData = null) {
    const resultDiv = document.getElementById("result");
    resultDiv.style.display = "block";
    resultDiv.className = type;
    
    if (studentData) {
        resultDiv.innerHTML = `
            <div style="font-weight: bold;">${message}</div>
            <hr>
            <div style="text-align: right;">
                <p>🧑‍🎓 الاسم: ${studentData.student_name}</p>
                <p>📚 الصف: ${studentData.student_grade}</p>
                <p>🏫 الشعبة: ${studentData.student_class}</p>
                <p>⏰ الوقت: ${studentData.time}</p>
                <p>🆔 الرقم: ${studentData.student_id}</p>
            </div>
        `;
    } else {
        resultDiv.innerHTML = message;
    }
}

function onScanSuccess(decodedText) {
    console.log("✅ تم المسح:", decodedText);
    stopScanner();
    showResult("🔄 جاري المعالجة...", "success");
    
    fetch('/process_scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qr_data: decodedText })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showResult(data.message, "success", data);
        } else {
            showResult(`❌ ${data.message}`, "error");
        }
        
        setTimeout(() => {
            if (confirm("هل تريد مسح طالب آخر؟")) {
                startScanner();
            }
        }, 2000);
    })
    .catch(error => {
        showResult(`❌ خطأ: ${error.message}`, "error");
        setTimeout(() => startScanner(), 2000);
    });
}

function startScanner() {
    const readerElement = document.getElementById("reader");
    readerElement.innerHTML = "";
    
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        onScanSuccess
    ).then(() => {
        isScanning = true;
        document.getElementById("startBtn").textContent = "⏹️ إيقاف";
        showResult("📷 الكاميرا تعمل... امسح QR", "success");
    }).catch(err => {
        showResult(`❌ لا يمكن تشغيل الكاميرا: ${err}`, "error");
    });
}

function stopScanner() {
    if (html5QrCode && isScanning) {
        html5QrCode.stop();
        isScanning = false;
        document.getElementById("startBtn").textContent = "▶️ بدء الكاميرا";
    }
}

function testManual() {
    const manualId = document.getElementById('manualId').value;
    if (!manualId) {
        alert('الرجاء إدخال رقم');
        return;
    }
    onScanSuccess(manualId);
}
</script>
</body>
</html>
