<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>مسح QR - نظام حضور الطلاب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .header h2 { color: #333; font-size: 20px; }
        .btn-icon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .camera-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .camera-area {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #video {
            width: 100%;
            display: none;
            transform: scaleX(-1);
        }
        .camera-buttons { display: flex; gap: 10px; margin-top: 10px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.97); }
        .stop-btn { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); display: none; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
            text-align: right;
        }
        .success { background: #d4edda; color: #155724; border-right: 5px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; border-right: 5px solid #dc3545; }
        .info { background: #d1ecf1; color: #0c5460; border-right: 5px solid #17a2b8; }
        .student-card {
            background: rgba(255,255,255,0.9);
            padding: 12px;
            border-radius: 12px;
            margin-top: 12px;
        }
        .student-card p { margin: 8px 0; }
        .manual-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #ddd;
        }
        .manual-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 2;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            text-align: center;
            font-family: inherit;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group button {
            flex: 1;
            margin: 0;
            background: #28a745;
        }
        .quick-section {
            margin-top: 15px;
        }
        .quick-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .quick-buttons button {
            background: #17a2b8;
            font-size: 13px;
            padding: 8px 15px;
            flex: none;
            width: auto;
        }
        .status-text { text-align: center; margin-top: 8px; font-size: 12px; color: #666; }
        .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .nav-buttons a {
            flex: 1;
            text-align: center;
            background: #6c757d;
            color: white;
            padding: 10px;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        hr {
            margin: 15px 0;
            border: none;
            border-top: 1px solid #eee;
        }
        @media (max-width: 550px) {
            .container { padding: 15px; }
            button { padding: 10px 16px; font-size: 14px; }
            .quick-buttons button { padding: 6px 12px; font-size: 12px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📱 مسح رمز الطالب</h2>
        <a href="/reports" class="btn-icon">📊 التقارير</a>
    </div>
    
    <!-- قسم الكاميرا -->
    <div class="camera-section">
        <div style="font-weight: bold; margin-bottom: 10px;">📷 مسح QR Code</div>
        <div class="camera-area">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
        <div class="camera-buttons">
            <button id="startCameraBtn">▶️ تشغيل الكاميرا</button>
            <button id="stopCameraBtn" class="stop-btn">⏹️ إيقاف الكاميرا</button>
        </div>
        <div id="cameraStatus" class="status-text"></div>
    </div>
    
    <!-- منطقة النتائج -->
    <div id="result" class="result-box"></div>
    
    <hr>
    
    <!-- قسم الإدخال اليدوي -->
    <div class="manual-section">
        <div class="manual-title">🖊️ إدخال رقم الطالب يدوياً</div>
        <div class="input-group">
            <input type="text" id="studentIdInput" placeholder="مثال: 1150436838" value="">
            <button id="registerBtn" onclick="registerManually()">✅ تسجيل الحضور</button>
        </div>
    </div>
    
    <!-- قسم الطلاب السريع -->
    <div class="quick-section">
        <div class="quick-title">⚡ تسجيل سريع:</div>
        <div id="quickStudents" class="quick-buttons">
            <span style="color:#999; font-size:12px;">جاري التحميل...</span>
        </div>
    </div>
    
    <!-- أزرار التنقل -->
    <div class="nav-buttons">
        <a href="/">🏠 الرئيسية</a>
        <a href="/reports">📊 التقارير</a>
    </div>
</div>

<script>
// عناصر DOM
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('startCameraBtn');
const stopBtn = document.getElementById('stopCameraBtn');
const cameraStatus = document.getElementById('cameraStatus');
const resultDiv = document.getElementById('result');
const studentIdInput = document.getElementById('studentIdInput');

let stream = null;
let scanning = false;
let animationId = null;

// ========== دالة التسجيل الرئيسية ==========
async function registerStudent(studentId) {
    if (!studentId || studentId.trim() === '') {
        showResult("⚠️ الرجاء إدخال رقم الطالب", "error");
        return false;
    }
    
    const id = studentId.trim();
    showResult("🔄 جاري تسجيل الحضور...", "info");
    
    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ student_id: id })
        });
        
        const data = await response.json();
        console.log("الرد:", data);
        
        if (data.success) {
            showResult(data.message, "success", data);
            studentIdInput.value = '';
            return true;
        } else {
            showResult(`❌ ${data.message}`, "error");
            return false;
        }
    } catch (error) {
        console.error("خطأ:", error);
        showResult(`❌ خطأ في الاتصال: ${error.message}`, "error");
        return false;
    }
}

// ========== الإدخال اليدوي ==========
function registerManually() {
    const studentId = studentIdInput.value;
    registerStudent(studentId);
}

// ========== عرض النتيجة ==========
function showResult(message, type, studentData = null) {
    resultDiv.style.display = 'block';
    resultDiv.className = `result-box ${type}`;
    
    if (studentData && studentData.student_name) {
        const statusIcon = studentData.status === 'حاضر' ? '✅' : (studentData.status === 'متأخر' ? '⏰' : '⚠️');
        resultDiv.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 10px;">${statusIcon} ${message}</div>
            <div class="student-card">
                <p>🧑‍🎓 <strong>الاسم:</strong> ${studentData.student_name}</p>
                <p>📚 <strong>الصف:</strong> ${studentData.student_grade} - الشعبة ${studentData.student_class}</p>
                <p>⏰ <strong>الوقت:</strong> ${studentData.time || new Date().toLocaleTimeString('ar-SA')}</p>
                <p>📅 <strong>التاريخ:</strong> ${studentData.date || new Date().toLocaleDateString('ar-SA')}</p>
            </div>
        `;
    } else {
        resultDiv.innerHTML = message;
    }
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ========== معالجة المسح من الكاميرا ==========
async function handleScannedCode(decodedText) {
    if (!decodedText) return;
    
    console.log("✅ تم مسح الرقم:", decodedText);
    stopScanner();
    await registerStudent(decodedText);
    
    // إعادة تشغيل الكاميرا بعد 3 ثوانٍ
    setTimeout(() => {
        if (stream && !scanning) {
            startScanner();
        }
    }, 3000);
}

// ========== مسح الإطار من الفيديو ==========
async function scanFrame() {
    if (!scanning || !video.videoWidth || !video.videoHeight) {
        animationId = requestAnimationFrame(scanFrame);
        return;
    }
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, canvas.width, canvas.height);
    
    if (code && code.data) {
        await handleScannedCode(code.data.trim());
    }
    
    animationId = requestAnimationFrame(scanFrame);
}

// ========== تشغيل الكاميرا ==========
async function startScanner() {
    if (stream) stopScanner();
    
    try {
        cameraStatus.innerHTML = "📷 جاري تشغيل الكاميرا...";
        cameraStatus.style.color = "#667eea";
        
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { exact: "environment" } } 
        });
        
        video.srcObject = stream;
        video.style.display = "block";
        await video.play();
        
        scanning = true;
        scanFrame();
        
        startBtn.style.display = "none";
        stopBtn.style.display = "block";
        cameraStatus.innerHTML = "✅ الكاميرا تعمل - وجه الهاتف نحو رمز QR";
        cameraStatus.style.color = "#28a745";
        
    } catch(err) {
        console.error("خطأ:", err);
        
        // محاولة ثانية
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = "block";
            await video.play();
            scanning = true;
            scanFrame();
            startBtn.style.display = "none";
            stopBtn.style.display = "block";
            cameraStatus.innerHTML = "✅ الكاميرا تعمل - وجه الهاتف نحو رمز QR";
            cameraStatus.style.color = "#28a745";
        } catch(err2) {
            cameraStatus.innerHTML = "❌ لا يمكن تشغيل الكاميرا - تأكد من منح الإذن";
            cameraStatus.style.color = "#dc3545";
            showResult("❌ لا يمكن تشغيل الكاميرا. الرجاء استخدام الإدخال اليدوي بدلاً من ذلك.", "error");
            startBtn.style.display = "block";
            stopBtn.style.display = "none";
        }
    }
}

// ========== إيقاف الكاميرا ==========
function stopScanner() {
    scanning = false;
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }
    video.srcObject = null;
    video.style.display = "none";
    startBtn.style.display = "block";
    stopBtn.style.display = "none";
    cameraStatus.innerHTML = "";
}

// ========== تحميل قائمة الطلاب للأزرار السريعة ==========
async function loadQuickStudents() {
    try {
        console.log("جاري تحميل الطلاب...");
        const response = await fetch('/api/students_list');
        const data = await response.json();
        console.log("بيانات الطلاب:", data);
        
        const container = document.getElementById('quickStudents');
        
        if (data.success && data.data && data.data.length > 0) {
            container.innerHTML = '';
            data.data.slice(0, 6).forEach(student => {
                const btn = document.createElement('button');
                btn.textContent = `${student.name}`;
                btn.title = `رقم: ${student.student_id}`;
                btn.onclick = () => {
                    studentIdInput.value = student.student_id;
                    registerStudent(student.student_id);
                };
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = '<span style="color:#999; font-size:12px;">لا توجد بيانات طلاب</span>';
        }
    } catch(e) {
        console.error("خطأ في تحميل الطلاب:", e);
        document.getElementById('quickStudents').innerHTML = '<span style="color:#999; font-size:12px;">خطأ في تحميل البيانات</span>';
    }
}

// ========== أحداث ==========
startBtn.addEventListener('click', startScanner);
stopBtn.addEventListener('click', stopScanner);

// السماح بإرسال الإدخال بالضغط على Enter
studentIdInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        registerManually();
    }
});

// تحميل القائمة عند فتح الصفحة
loadQuickStudents();

// تنظيف عند مغادرة الصفحة
window.addEventListener('beforeunload', () => {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
    }
    if (animationId) {
        cancelAnimationFrame(animationId);
    }
});
</script>
</body>
</html>
