{% extends "base.html" %}
{% block title %}تقارير الصف والفصل{% endblock %}
{% block page_title %}<i class="fas fa-users"></i> تقارير الصف والفصل{% endblock %}

{% block content %}
<div class="action-buttons">
    <button class="action-btn action-btn-pdf" onclick="window.print()"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
    <button class="action-btn action-btn-excel" id="exportExcelBtn"><i class="fas fa-file-excel"></i> تصدير Excel</button>
</div>

<div class="card">
    <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 25px; align-items: flex-end;">
        <div><label style="display:block;font-size:12px;color:#718096;"><i class="fas fa-graduation-cap"></i> الصف</label>
        <select id="gradeSelect" style="padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0; min-width: 150px;">
            <option value="">جميع الصفوف</option>
            <option value="الأول الثانوي">الأول الثانوي</option>
            <option value="الثاني الثانوي">الثاني الثانوي</option>
            <option value="الثالث الثانوي">الثالث الثانوي</option>
        </select></div>
        <div><label style="display:block;font-size:12px;color:#718096;"><i class="fas fa-layer-group"></i> الفصل/الشعبة</label>
        <select id="classSelect" style="padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0;">
            <option value="">جميع الشعب</option>
            <option value="1">الشعبة 1</option><option value="2">الشعبة 2</option><option value="3">الشعبة 3</option>
            <option value="4">الشعبة 4</option><option value="5">الشعبة 5</option><option value="6">الشعبة 6</option>
        </select></div>
        <div><label style="display:block;font-size:12px;color:#718096;"><i class="fas fa-calendar"></i> التاريخ</label>
        <input type="date" id="dateSelect" style="padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0;"></div>
        <button id="filterBtn" style="padding: 12px 30px; background: linear-gradient(135deg,#667eea,#764ba2); color: white; border: none; border-radius: 12px; cursor: pointer;"><i class="fas fa-search"></i> عرض التقرير</button>
    </div>

    <div id="summaryStats" class="stats-grid" style="display: none;"></div>
    <div class="table-wrapper">
        <div id="reportTable"><div style="text-align:center;padding:60px;"><i class="fas fa-chart-line fa-2x" style="color:#cbd5e0;"></i><br>اختر الصف والفصل والتاريخ ثم اضغط عرض</div></div>
    </div>
</div>

<script>
    let currentData = [];

    async function loadReport() {
        const grade = document.getElementById('gradeSelect').value;
        const classVal = document.getElementById('classSelect').value;
        const date = document.getElementById('dateSelect').value;
        if (!date) { alert('الرجاء اختيار التاريخ'); return; }
        
        const res = await fetch(`/api/attendance_details/${date}`);
        const data = await res.json();
        
        if (data.success && data.data) {
            let filtered = data.data;
            if (grade) filtered = filtered.filter(s => s.grade === grade);
            if (classVal) filtered = filtered.filter(s => s.class === classVal);
            currentData = filtered;
            
            if (filtered.length === 0) {
                document.getElementById('reportTable').innerHTML = '<div style="text-align:center;padding:60px;"><i class="fas fa-search fa-2x" style="color:#cbd5e0;"></i><br>⚠️ لا توجد بيانات للعرض</div>';
                document.getElementById('summaryStats').style.display = 'none';
                return;
            }
            
            const present = filtered.filter(s => s.status === 'حاضر في الوقت').length;
            const late = filtered.filter(s => s.status === 'متأخر').length;
            const absent = filtered.filter(s => s.status === 'غائب').length;
            document.getElementById('summaryStats').style.display = 'grid';
            document.getElementById('summaryStats').innerHTML = `
                <div class="stat-card"><h3><i class="fas fa-check-circle"></i> ✅ حاضر</h3><div class="stat-value" style="color:#48bb78;">${present}</div></div>
                <div class="stat-card"><h3><i class="fas fa-clock"></i> ⏰ متأخر</h3><div class="stat-value" style="color:#ed8936;">${late}</div></div>
                <div class="stat-card"><h3><i class="fas fa-times-circle"></i> ❌ غائب</h3><div class="stat-value" style="color:#fc8181;">${absent}</div></div>
                <div class="stat-card"><h3><i class="fas fa-chart-line"></i> نسبة الحضور</h3><div class="stat-value" style="color:#667eea;">${Math.round((present+late)/filtered.length*100)}%</div></div>
            `;
            
            let html = `<table><thead><th>#</th><th>رقم الطالب</th><th>اسم الطالب</th><th>الصف</th><th>الشعبة</th><th>الحالة</th><th>وقت التسجيل</th></thead><tbody>`;
            filtered.forEach((s, i) => {
                let statusClass = s.status === 'حاضر في الوقت' ? 'present' : (s.status === 'متأخر' ? 'late' : 'absent');
                let statusText = s.status === 'حاضر في الوقت' ? '✅ حاضر' : (s.status === 'متأخر' ? '⏰ متأخر' : '❌ غائب');
                html += `<tr><td>${i+1}</td><td>${s.student_id}</td><td>${s.student_name}</td><td>${s.grade}</td><td>${s.class}</td><td class="${statusClass}">${statusText}</td><td>${s.time}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('reportTable').innerHTML = html;
        }
    }
    
    function exportToExcel() {
        if (currentData.length === 0) { alert('لا توجد بيانات للتصدير'); return; }
        let csv = "رقم الطالب,اسم الطالب,الصف,الشعبة,الحالة,وقت التسجيل\n";
        currentData.forEach(s => {
            csv += `"${s.student_id}","${s.student_name}","${s.grade}","${s.class}","${s.status === 'حاضر في الوقت' ? 'حاضر' : (s.status === 'متأخر' ? 'متأخر' : 'غائب')}","${s.time}"\n`;
        });
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `class_report_${document.getElementById('dateSelect').value}.csv`;
        link.click();
    }
    
    document.getElementById('filterBtn').addEventListener('click', loadReport);
    document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
    document.getElementById('dateSelect').valueAsDate = new Date();
</script>
{% endblock %}
