<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>أكواد QR للطلاب</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .qr-card { background: white; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .qr-card img { width: 150px; height: 150px; }
        .qr-card h4 { margin: 10px 0; }
        .qr-card p { color: #666; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📱 أكواد QR للطلاب</h1>
    <p>امسح الكود لفتح صفحة تسجيل الحضور مباشرة</p>
    <div class="qr-grid" id="qrGrid">جاري التحميل...</div>
</div>
<script>
    fetch('/api/all_students_qr')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                const grid = document.getElementById('qrGrid');
                grid.innerHTML = data.data.map(student => `
                    <div class="qr-card">
                        <img src="${student.qr_code}" alt="QR Code">
                        <h4>${student.student_name}</h4>
                        <p>رقم: ${student.student_id}</p>
                    </div>
                `).join('');
            }
        });
</script>
</body>
</html>
