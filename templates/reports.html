<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير - نظام حضور الطلاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: white;
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .tab:hover {
            transform: translateY(-2px);
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 14px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .present {
            color: #28a745;
            font-weight: bold;
        }
        
        .late {
            color: #fd7e14;
            font-weight: bold;
        }
        
        .absent {
            color: #dc3545;
            font-weight: bold;
        }
        
        button, .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            margin: 10px 5px;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-back {
            background: #6c757d;
        }
        
        .date-picker, .search-input {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            margin: 10px 5px;
            font-size: 14px;
            font-family: inherit;
        }
        
        .date-picker:focus, .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #999;
        }
        
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        @media print {
            .no-print {
                display: none;
            }
            .stat-card, .tab-content {
                box-shadow: none;
                border: 1px solid #ddd;
            }
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .stat-number {
                font-size: 28px;
            }
            
            .tab {
                padding: 8px 16px;
                font-size: 14px;
            }
            
            th, td {
                padding: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header no-print">
        <h1>📊 تقارير الحضور والتأخير</h1>
        <p>نظام متابعة حضور الطلاب - إحصائيات وتقارير دقيقة</p>
    </div>

    <!-- إحصائيات سريعة -->
    <div class="stats-grid" id="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalStudents">-</div>
            <div class="stat-label">📚 إجمالي الطلاب</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="presentCount">-</div>
            <div class="stat-label">✅ الحاضرون في الوقت</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="lateCount">-</div>
            <div class="stat-label">⏰ المتأخرون</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="absentCount">-</div>
            <div class="stat-label">❌ الغائبون</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="attendancePercentage">-</div>
            <div class="stat-label">📈 نسبة الحضور اليوم</div>
        </div>
    </div>

    <!-- تبويبات التقارير -->
    <div class="tabs no-print">
        <button class="tab active" onclick="showTab(event, 'today')">📅 تقرير اليوم</button>
        <button class="tab" onclick="showTab(event, 'date')">🗓️ تقرير بتاريخ محدد</button>
        <button class="tab" onclick="showTab(event, 'absent')">❌ الطلاب الغائبون</button>
        <button class="tab" onclick="showTab(event, 'student')">🔍 بحث عن طالب</button>
        <button class="tab" onclick="showTab(event, 'all')">📋 جميع السجلات</button>
    </div>

    <!-- تبويب تقرير اليوم -->
    <div id="tab-today" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <h3>📋 تفاصيل حضور اليوم - <span id="todayDate"></span></h3>
            <div class="no-print">
                <button onclick="exportToday()">📥 تحميل Excel</button>
                <button onclick="printReport()">🖨️ طباعة</button>
            </div>
        </div>
        <div id="todayTable" class="table-container"></div>
    </div>

    <!-- تبويب تاريخ محدد -->
    <div id="tab-date" class="tab-content" style="display:none;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <input type="date" id="selectedDate" class="date-picker">
            <button onclick="loadDateReport()">عرض التقرير</button>
        </div>
        <div id="dateReport"></div>
    </div>

    <!-- تبويب الطلاب الغائبين -->
    <div id="tab-absent" class="tab-content" style="display:none;">
        <h3>❌ قائمة الطلاب الغائبين اليوم</h3>
        <div id="absentTable" class="table-container"></div>
    </div>

    <!-- تبويب بحث طالب -->
    <div id="tab-student" class="tab-content" style="display:none;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <input type="text" id="studentSearch" class="search-input" placeholder="أدخل رقم الطالب أو الاسم" style="width: 300px;">
            <button onclick="searchStudent()">🔍 بحث</button>
        </div>
        <div id="studentReport"></div>
    </div>

    <!-- تبويب جميع السجلات -->
    <div id="tab-all" class="tab-content" style="display:none;">
        <h3>📋 جميع سجلات الحضور</h3>
        <div id="allRecordsTable" class="table-container"></div>
    </div>
    
    <div class="no-print" style="margin-top: 20px; text-align: center;">
        <button onclick="window.location.href='/'" class="btn-back">🏠 العودة للرئيسية</button>
    </div>
</div>

<script>
// تحميل الإحصائيات عند تحميل الصفحة
loadStats();
loadTodayAttendance();

function showTab(event, tabName) {
    // إخفاء كل التبويبات
    document.querySelectorAll('.tab-content').forEach(tab => {
        tab.style.display = 'none';
    });
    document.getElementById(`tab-${tabName}`).style.display = 'block';
    
    // تحديث active class
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });
    event.target.classList.add('active');
    
    // تحميل البيانات حسب التبويب
    if (tabName === 'today') {
        loadTodayAttendance();
    } else if (tabName === 'absent') {
        loadAbsentStudents();
    } else if (tabName === 'all') {
        loadAllRecords();
    }
}

// تحميل الإحصائيات
async function loadStats() {
    try {
        const response = await fetch('/api/attendance_summary');
        const data = await response.json();
        
        if (data.success) {
            document.getElementById('totalStudents').textContent = data.total_students || 0;
            document.getElementById('presentCount').textContent = data.present || 0;
            document.getElementById('lateCount').textContent = data.late || 0;
            document.getElementById('absentCount').textContent = data.absent || 0;
            document.getElementById('attendancePercentage').textContent = `${data.percentage || 0}%`;
            document.getElementById('todayDate').textContent = data.date;
        }
    } catch (error) {
        console.error('خطأ في تحميل الإحصائيات:', error);
    }
}

// تحميل حضور اليوم
async function loadTodayAttendance() {
    const today = new Date().toISOString().split('T')[0];
    await loadAttendanceByDate(today, 'todayTable');
}

// تحميل حضور بتاريخ محدد
async function loadDateReport() {
    const date = document.getElementById('selectedDate').value;
    if (!date) {
        alert('⚠️ الرجاء اختيار تاريخ');
        return;
    }
    await loadAttendanceByDate(date, 'dateReport');
}

async function loadAttendanceByDate(date, elementId) {
    try {
        const response = await fetch(`/api/attendance_details/${date}`);
        const data = await response.json();
        
        const container = document.getElementById(elementId);
        
        if (!data.success || data.data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <h3>لا توجد بيانات</h3>
                    <p>لا يوجد سجلات حضور لهذا التاريخ</p>
                </div>
            `;
            return;
        }
        
        let html = `<div style="margin-bottom: 15px;">
                    <strong>📅 التاريخ: ${date}</strong> | 
                    <strong>👥 عدد الحضور: ${data.count}</strong>
                   </div>
                   <table>
                    <thead>
                        <tr><th>رقم الطالب</th><th>الاسم</th><th>الصف</th><th>الشعبة</th><th>الوقت</th><th>الحالة</th></tr>
                    </thead>
                    <tbody>`;
        
        data.data.forEach(record => {
            let statusClass = record.status === 'حاضر في الوقت' ? 'present' : 'late';
            let statusIcon = record.status === 'حاضر في الوقت' ? '✅' : '⏰';
            
            html += `<tr>
                        <td>${record.student_id}</td>
                        <td>${record.student_name}</td>
                        <td>${record.grade}</td>
                        <td>${record.class}</td>
                        <td>${record.time}</td>
                        <td class="${statusClass}">${statusIcon} ${record.status}</td>
                     </tr>`;
        });
        
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (error) {
        console.error('خطأ:', error);
        document.getElementById(elementId).innerHTML = '<div class="empty-state">⚠️ خطأ في تحميل البيانات</div>';
    }
}

// تحميل الطلاب الغائبين
async function loadAbsentStudents() {
    try {
        const response = await fetch('/api/absent_students');
        const data = await response.json();
        
        const container = document.getElementById('absentTable');
        
        if (!data.success || data.data.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">🎉</div>
                    <h3>لا يوجد غائبون</h3>
                    <p>جميع الطلاب حاضرون اليوم!</p>
                </div>
            `;
            return;
        }
        
        let html = `<
