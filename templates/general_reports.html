{% extends "base.html" %}
{% block title %}التقارير العامة{% endblock %}
{% block page_title %}<i class="fas fa-chart-line"></i> التقارير العامة{% endblock %}

{% block content %}
<div class="action-buttons">
    <button class="action-btn action-btn-pdf" onclick="window.print()"><i class="fas fa-file-pdf"></i> طباعة PDF</button>
    <button class="action-btn action-btn-excel" id="exportExcelBtn"><i class="fas fa-file-excel"></i> تصدير Excel</button>
</div>

<!-- تبويبات التقارير -->
<div class="nav-buttons" style="margin-bottom: 20px; justify-content: center;">
    <button class="nav-btn nav-btn-primary" id="tabDailyBtn" style="background:linear-gradient(135deg,#667eea,#764ba2);"><i class="fas fa-calendar-day"></i> التقرير اليومي</button>
    <button class="nav-btn nav-btn-info" id="tabDateBtn" style="background:linear-gradient(135deg,#4299e1,#3182ce);"><i class="fas fa-calendar-alt"></i> تقرير بتاريخ محدد</button>
    <button class="nav-btn nav-btn-success" id="tabStudentBtn" style="background:linear-gradient(135deg,#48bb78,#38a169);"><i class="fas fa-user-graduate"></i> تقرير طالب محدد</button>
</div>

<!-- التقرير اليومي -->
<div id="dailyReportSection">
    <div class="stats-grid">
        <div class="stat-card"><h3><i class="fas fa-user-check"></i> ✅ حاضر في الوقت</h3><div class="stat-value" id="presentCount">0</div></div>
        <div class="stat-card"><h3><i class="fas fa-clock"></i> ⏰ متأخر</h3><div class="stat-value" id="lateCount">0</div></div>
        <div class="stat-card"><h3><i class="fas fa-user-times"></i> ❌ غائب</h3><div class="stat-value" id="absentCount">0</div></div>
        <div class="stat-card"><h3><i class="fas fa-users"></i> 👨‍🎓 إجمالي الطلاب</h3><div class="stat-value" id="totalCount">0</div></div>
    </div>
    <div class="card">
        <h3 class="card-title"><i class="fas fa-list"></i> تفاصيل الحضور اليوم</h3>
        <div class="table-wrapper">
            <div id="dailyTable">جاري التحميل...</div>
        </div>
    </div>
</div>

<!-- تقرير بتاريخ محدد -->
<div id="dateReportSection" style="display: none;">
    <div class="card">
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end;">
            <div><label style="display:block;font-size:12px;color:#718096;"><i class="fas fa-calendar"></i> اختر التاريخ</label>
            <input type="date" id="specificDate" style="padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0; width: 250px;"></div>
            <button id="loadDateBtn" style="padding: 12px 25px; background: linear-gradient(135deg,#667eea,#764ba2); color: white; border: none; border-radius: 12px; cursor: pointer;"><i class="fas fa-search"></i> عرض التقرير</button>
        </div>
        <div class="table-wrapper">
            <div id="dateTable">اختر تاريخ ثم اضغط عرض</div>
        </div>
    </div>
</div>

<!-- تقرير طالب محدد -->
<div id="studentReportSection" style="display: none;">
    <div class="card">
        <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end;">
            <div><label style="display:block;font-size:12px;color:#718096;"><i class="fas fa-id-card"></i> رقم الطالب</label>
            <input type="text" id="studentId" placeholder="أدخل رقم الطالب" style="padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0; width: 250px;"></div>
            <button id="loadStudentBtn" style="padding: 12px 25px; background: linear-gradient(135deg,#48bb78,#38a169); color: white; border: none; border-radius: 12px; cursor: pointer;"><i class="fas fa-search"></i> عرض التقرير</button>
        </div>
        <div id="studentInfo" style="margin-bottom: 20px;"></div>
        <div class="table-wrapper">
            <div id="studentTable"></div>
        </div>
    </div>
</div>

<script>
    // التبديل بين التبويبات
    document.getElementById('tabDailyBtn').onclick = () => {
        document.getElementById('dailyReportSection').style.display = 'block';
        document.getElementById('dateReportSection').style.display = 'none';
        document.getElementById('studentReportSection').style.display = 'none';
        loadDailyReport();
    };
    document.getElementById('tabDateBtn').onclick = () => {
        document.getElementById('dailyReportSection').style.display = 'none';
        document.getElementById('dateReportSection').style.display = 'block';
        document.getElementById('studentReportSection').style.display = 'none';
    };
    document.getElementById('tabStudentBtn').onclick = () => {
        document.getElementById('dailyReportSection').style.display = 'none';
        document.getElementById('dateReportSection').style.display = 'none';
        document.getElementById('studentReportSection').style.display = 'block';
    };

    // التقرير اليومي
    async function loadDailyReport() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const res = await fetch(`/api/attendance_details/${today}`);
            const data = await res.json();
            const stats = await fetch('/api/dashboard_stats');
            const statsData = await stats.json();
            
            if (statsData.success) {
                document.getElementById('presentCount').innerHTML = statsData.present || 0;
                document.getElementById('lateCount').innerHTML = statsData.late || 0;
                document.getElementById('absentCount').innerHTML = statsData.absent || 0;
                document.getElementById('totalCount').innerHTML = statsData.total_students || 0;
            }
            
            if (data.success && data.data) {
                let html = `<table><thead><th>#</th><th>رقم الطالب</th><th>اسم الطالب</th><th>الصف</th><th>الشعبة</th><th>الحالة</th><th>وقت التسجيل</th></thead><tbody>`;
                data.data.forEach((s, i) => {
                    let statusClass = s.status === 'حاضر في الوقت' ? 'present' : (s.status === 'متأخر' ? 'late' : 'absent');
                    let statusText = s.status === 'حاضر في الوقت' ? '✅ حاضر' : (s.status === 'متأخر' ? '⏰ متأخر' : '❌ غائب');
                    html += `<tr><td>${i+1}</td><td>${s.student_id}</td><td>${s.student_name}</td><td>${s.grade}</td><td>${s.class}</td><td class="${statusClass}">${statusText}</td><td>${s.time}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('dailyTable').innerHTML = html;
            }
        } catch(e) { console.error(e); }
    }
    
    // تقرير بتاريخ محدد
    async function loadDateReport() {
        const date = document.getElementById('specificDate').value;
        if (!date) { alert('الرجاء اختيار التاريخ'); return; }
        const res = await fetch(`/api/attendance_details/${date}`);
        const data = await res.json();
        if (data.success && data.data) {
            let html = `<tr><thead><th>#</th><th>رقم الطالب</th><th>اسم الطالب</th><th>الصف</th><th>الشعبة</th><th>الحالة</th><th>وقت التسجيل</th></thead><tbody>`;
            data.data.forEach((s, i) => {
                let statusClass = s.status === 'حاضر في الوقت' ? 'present' : (s.status === 'متأخر' ? 'late' : 'absent');
                let statusText = s.status === 'حاضر في الوقت' ? '✅ حاضر' : (s.status === 'متأخر' ? '⏰ متأخر' : '❌ غائب');
                html += `<tr><td>${i+1}</td><td>${s.student_id}</td><td>${s.student_name}</td><td>${s.grade}</td><td>${s.class}</td><td class="${statusClass}">${statusText}</td><td>${s.time}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('dateTable').innerHTML = html;
        }
    }
    
    // تقرير طالب محدد
    async function loadStudentReport() {
        const studentId = document.getElementById('studentId').value.trim();
        if (!studentId) { alert('الرجاء إدخال رقم الطالب'); return; }
        const res = await fetch(`/api/student_report/${studentId}`);
        const data = await res.json();
        if (data.success) {
            document.getElementById('studentInfo').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><h3>👨‍🎓 اسم الطالب</h3><div class="stat-value" style="font-size:24px;">${data.student_name}</div></div>
                    <div class="stat-card"><h3>📚 الصف</h3><div class="stat-value" style="font-size:24px;">${data.grade}</div></div>
                    <div class="stat-card"><h3>🏫 الشعبة</h3><div class="stat-value" style="font-size:24px;">${data.class}</div></div>
                    <div class="stat-card"><h3>📊 عدد أيام الحضور</h3><div class="stat-value" style="font-size:24px;">${data.records.length}</div></div>
                </div>
            `;
            if (data.records.length === 0) {
                document.getElementById('studentTable').innerHTML = '<div style="text-align:center;padding:40px;">⚠️ لا توجد سجلات حضور لهذا الطالب</div>';
                return;
            }
            let html = `<table><thead><th>#</th><th>التاريخ</th><th>الوقت</th><th>الحالة</th></thead><tbody>`;
            data.records.forEach((r, i) => {
                let statusClass = r.status === 'حاضر في الوقت' ? 'present' : 'late';
                html += `<tr><td>${i+1}</td><td>${r.date}</td><td>${r.time}</td><td class="${statusClass}">${r.status === 'حاضر في الوقت' ? '✅ حاضر' : '⏰ متأخر'}</td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('studentTable').innerHTML = html;
        } else {
            document.getElementById('studentInfo').innerHTML = `<div style="color:#e53e3e;text-align:center;padding:20px;">❌ ${data.error}</div>`;
        }
    }
    
    document.getElementById('loadDateBtn').addEventListener('click', loadDateReport);
    document.getElementById('loadStudentBtn').addEventListener('click', loadStudentReport);
    document.getElementById('specificDate').valueAsDate = new Date();
    
    loadDailyReport();
</script>
{% endblock %}
